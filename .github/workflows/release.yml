name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Build and upload binaries for each platform
  build-binaries:
    strategy:
      matrix:
        include:
          - target: bun-linux-x64
            os: ubuntu-latest
            artifact: ticktick-linux-x64
          - target: bun-linux-arm64
            os: ubuntu-latest
            artifact: ticktick-linux-arm64
          - target: bun-darwin-x64
            os: macos-latest
            artifact: ticktick-darwin-x64
          - target: bun-darwin-arm64
            os: macos-latest
            artifact: ticktick-darwin-arm64
          - target: bun-windows-x64
            os: windows-latest
            artifact: ticktick-windows-x64.exe

    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      - name: Build binary
        run: |
          bun build ./src/index.ts --compile --target=${{ matrix.target }} --outfile=${{ matrix.artifact }}
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # Create GitHub Release and attach binaries
  release:
    needs: build-binaries
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true
      
      - name: Create checksums
        run: |
          cd binaries
          sha256sum * > checksums.txt
          cat checksums.txt
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            binaries/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish to npm (only on public repos when NPM_TOKEN is set)
  publish-npm:
    runs-on: ubuntu-latest
    # Skip if NPM_TOKEN isn't configured
    if: ${{ secrets.NPM_TOKEN != '' }}
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      - name: Build (JS for npm)
        run: bun run build
      
      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
