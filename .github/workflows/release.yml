name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build JS (for npm)
        run: bun run build

      - name: Build binaries for all platforms
        run: |
          mkdir -p binaries/{darwin-arm64,darwin-x64,linux-x64,linux-arm64,windows-x64}

          echo "Building for darwin-arm64..."
          bun build --compile --target=bun-darwin-arm64 ./src/index.ts --outfile binaries/darwin-arm64/ticktick

          echo "Building for darwin-x64..."
          bun build --compile --target=bun-darwin-x64 ./src/index.ts --outfile binaries/darwin-x64/ticktick

          echo "Building for linux-x64..."
          bun build --compile --target=bun-linux-x64 ./src/index.ts --outfile binaries/linux-x64/ticktick

          echo "Building for linux-arm64..."
          bun build --compile --target=bun-linux-arm64 ./src/index.ts --outfile binaries/linux-arm64/ticktick

          echo "Building for windows-x64..."
          bun build --compile --target=bun-windows-x64 ./src/index.ts --outfile binaries/windows-x64/ticktick.exe

      - name: Create release archives
        run: |
          # Copy shared files to each platform directory
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64 windows-x64; do
            cp README.md binaries/$platform/
            cp LICENSE binaries/$platform/
            [ -f CHANGELOG.md ] && cp CHANGELOG.md binaries/$platform/
          done

          cd binaries

          # Unix platforms (tar.gz)
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            tar -czf ticktick-$platform.tar.gz -C $platform .
          done

          # Windows (zip)
          cd windows-x64 && zip -r ../ticktick-windows-x64.zip . && cd ..

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${RELEASE_TAG}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix

          if [ -f CHANGELOG.md ]; then
            # Extract changelog section for this version
            awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > /tmp/release-notes.md
          fi

          # If empty or no changelog, use a default message
          if [ ! -s /tmp/release-notes.md ]; then
            echo "Release ${RELEASE_TAG}" > /tmp/release-notes.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd binaries

          # Create release with changelog notes (or update if exists)
          gh release create "${RELEASE_TAG}" \
            --title "${RELEASE_TAG}" \
            --notes-file /tmp/release-notes.md \
            ticktick-darwin-arm64.tar.gz \
            ticktick-darwin-x64.tar.gz \
            ticktick-linux-x64.tar.gz \
            ticktick-linux-arm64.tar.gz \
            ticktick-windows-x64.zip \
            2>/dev/null || \
          gh release upload "${RELEASE_TAG}" \
            ticktick-darwin-arm64.tar.gz \
            ticktick-darwin-x64.tar.gz \
            ticktick-linux-x64.tar.gz \
            ticktick-linux-arm64.tar.gz \
            ticktick-windows-x64.zip \
            --clobber

      # Publish to npm (only when NPM_TOKEN is configured)
      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
