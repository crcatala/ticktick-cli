name: Live Integration Tests

on:
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable debug logging'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  live-tests:
    runs-on: ubicloud-standard-2
    env:
      TICKTICK_TOKEN: ${{ secrets.TICKTICK_TOKEN }}
    
    steps:
      - name: Check for token
        run: |
          if [ -z "$TICKTICK_TOKEN" ]; then
            echo "::warning::TICKTICK_TOKEN secret is not set. Skipping live tests."
            echo "SKIP_TESTS=true" >> $GITHUB_ENV
          fi
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run live integration tests
        if: env.SKIP_TESTS != 'true'
        env:
          RUN_LIVE_TESTS: "1"
          TICKTICK_DEBUG: ${{ inputs.debug == 'true' && '1' || '0' }}
        run: bun test tests/integration/live-api.test.ts --timeout 60000

      - name: Test Summary
        if: always() && env.SKIP_TESTS != 'true'
        run: |
          echo "## Live Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ All live tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some live tests failed" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Skipped Summary
        if: env.SKIP_TESTS == 'true'
        run: |
          echo "## Live Integration Tests Skipped" >> $GITHUB_STEP_SUMMARY
          echo "TICKTICK_TOKEN secret not configured." >> $GITHUB_STEP_SUMMARY
