name: Live Integration Tests

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      debug:
        description: Enable debug logging
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]
      pr_number:
        description: PR number for status updates
        required: false
        type: string
      pr_sha:
        description: PR head SHA for status updates
        required: false
        type: string

jobs:
  dispatch-live-tests:
    name: Dispatch live tests
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/run-live-tests') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubicloud-standard-2
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - name: Get PR information
        id: pr
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8.0.0
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            if (pr.data.head.repo.full_name !== pr.data.base.repo.full_name) {
              core.setFailed('Live tests cannot run on fork PRs because they require repository secrets.');
              return;
            }

            core.setOutput('ref', pr.data.head.ref);
            core.setOutput('sha', pr.data.head.sha);
            core.setOutput('number', pr.data.number);

      - name: Dispatch live tests on the PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run live-tests.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ steps.pr.outputs.ref }}" \
            --field pr_number="${{ steps.pr.outputs.number }}" \
            --field pr_sha="${{ steps.pr.outputs.sha }}" \
            --field debug=false

  live-tests:
    name: Run live API tests
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubicloud-standard-2
    permissions:
      contents: read
      checks: write
      pull-requests: write
    env:
      TICKTICK_TOKEN: ${{ secrets.TICKTICK_TOKEN }}

    steps:
      - name: Check for token
        run: |
          if [ -z "$TICKTICK_TOKEN" ]; then
            echo "::warning::TICKTICK_TOKEN secret is not set. Skipping live tests."
            echo "SKIP_TESTS=true" >> "$GITHUB_ENV"
          fi

      - name: Create pending check
        id: create_check
        if: inputs.pr_sha != '' && env.SKIP_TESTS != 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8.0.0
        with:
          script: |
            const check = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Live API Tests',
              head_sha: '${{ inputs.pr_sha }}',
              status: 'in_progress',
              details_url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
              output: {
                title: 'Running live tests...',
                summary: '[View live logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})',
              },
            });
            core.setOutput('id', check.data.id);

      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          ref: ${{ inputs.pr_sha || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run live integration tests
        id: tests
        if: env.SKIP_TESTS != 'true'
        env:
          RUN_LIVE_TESTS: "1"
          TICKTICK_DEBUG: ${{ inputs.debug == 'true' && '1' || '0' }}
        run: bun run test -- tests/integration/live-api.test.ts --timeout 60000

      - name: Update check
        if: always() && inputs.pr_sha != '' && env.SKIP_TESTS != 'true' && steps.create_check.outputs.id != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8.0.0
        with:
          script: |
            const success = '${{ steps.tests.outcome }}' === 'success';
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: Number('${{ steps.create_check.outputs.id }}'),
              status: 'completed',
              conclusion: success ? 'success' : 'failure',
              details_url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
              output: {
                title: success ? 'All live tests passed' : 'Live tests failed',
                summary: '[View live logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})',
              },
            });

      - name: Comment on PR
        if: always() && inputs.pr_number != '' && env.SKIP_TESTS != 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8.0.0
        with:
          script: |
            const success = '${{ steps.tests.outcome }}' === 'success';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ inputs.pr_number }}'),
              body: `${success ? '✅' : '❌'} Live API tests ${success ? 'passed' : 'failed'}. [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
            });

      - name: Test summary
        if: always() && env.SKIP_TESTS != 'true'
        run: |
          echo "## Live Integration Test Results" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.tests.outcome }}" = "success" ]; then
            echo "✅ All live tests passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Some live tests failed" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Skipped summary
        if: env.SKIP_TESTS == 'true'
        run: |
          echo "## Live Integration Tests Skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "TICKTICK_TOKEN secret is not configured." >> "$GITHUB_STEP_SUMMARY"
