[project]
name = "ticktick-cli"
version = "0.1.0"
description = "A CLI for TickTick"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "pyticktick @ git+https://github.com/sebpretzer/pyticktick.git",
    "rich>=13.0.0",
    "tomli-w>=1.0.0",
    "keyring>=25.0.0",
]

[project.scripts]
ticktick = "ticktick_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
